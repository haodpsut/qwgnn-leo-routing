# Conda environment for the QW-GNN LEO routing experiments.
#   conda env create -f environment.yml
#   conda activate qwgnn
# torch is installed CPU-only, from the cpu wheel index, because that is what produced
# every number in results/: see RESULTS-PROVENANCE.md, which records torch 2.13.0+cpu with
# cuda.is_available() == False. A CUDA build is not wrong to use, but it is not what we
# measured, and the GNN forward is 0.05% of a slot here (Fig. on inference cost), so the
# device makes no difference to the cost argument.
name: qwgnn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - networkx
  - pandas
  - matplotlib
  - tqdm
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - skyfield
      - sgp4
